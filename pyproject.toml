[project]
name = "shisis-async"
version = "1.2.1"
description = "TU-Berlin Isis Shibboleth login library"
authors = [
  {name = "bchmnn",email = "shisis@gandalf.mozmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["Moodle", "Isis", "Shibboleth", "TU-Berlin", "Authentication"]
requires-python = ">=3.10"
dependencies = [
  "aiohttp >=3.0,<4.0",
  "beautifulsoup4 >=4.0,<5.0",
  "lxml >=5.0,<7.0"
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]

[tool.isort]
profile = "black"

[project.scripts]
shisis = "shisis.__main__:cli"

[project.urls]
Repository = "https://github.com/bchmnn/shisis-async"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "" # we don't want a src dir
module-name = "shisis"
